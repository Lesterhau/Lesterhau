name: Update Substack Posts

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Fetch latest Substack posts
        uses: gautamkrishnar/blog-post-workflow@v2
        with:
          feed_list: "https://rlperspectives.substack.com/feed"
          max_post_count: 3
          readme_path: "README.md"
          comment_tag_name: "SUBSTACK"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
